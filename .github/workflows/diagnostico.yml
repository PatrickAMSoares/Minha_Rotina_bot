name: Diagnostico

on:
  workflow_dispatch:
    inputs:
      enviar_teste:
        description: "Mandar uma mensagem de teste com botao"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar a ligacao com o Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENVIAR_TESTE: ${{ inputs.enviar_teste }}
        run: python bot/diagnostico.py
